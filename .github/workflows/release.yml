name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stamp version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" Support/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $version" Support/Info.plist

      - name: Build and zip app bundle
        run: |
          make zip
          mv dist/LightSnap.zip "dist/LightSnap-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          Universal (Apple Silicon + Intel) build for macOS 14 or later.

          **First launch of a downloaded copy:** this zip is ad-hoc signed, so Gatekeeper will warn. Either run

          `xattr -dr com.apple.quarantine LightSnap.app`

          or approve the app via System Settings → Privacy & Security → "Open Anyway". See the README for producing notarized builds with a Developer ID.
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            "dist/LightSnap-${GITHUB_REF_NAME}.zip" \
            --title "LightSnap $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes"
