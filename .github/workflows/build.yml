name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Universal (arm64 + x86_64) bundle, zipped with ditto so the
      # signature and executable permissions survive the artifact round-trip.
      - name: Build and zip app bundle
        run: make zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: LightSnap
          path: dist/LightSnap.zip
